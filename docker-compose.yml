services:
  db:
    image: postgres:15-alpine
    container_name: college_db
    restart: always
    environment:
      POSTGRES_USER: college_user
      POSTGRES_PASSWORD: college_password
      POSTGRES_DB: college_flow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: college_api
    restart: always
    depends_on:
      - db
    environment:
      - SERVICE_NAME=api
      - DEV_MODE=true
      - DATABASE_URL=postgresql+asyncpg://college_user:college_password@db:5432/college_flow
      - BOT_TOKEN=8398930262:AAFH4EcmJLCLoVW2d8-fRjGKBN7HQ28xwsg
    volumes:
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  bot:
    build: ./backend
    container_name: college_bot
    restart: always
    depends_on:
      - api
    environment:
      - SERVICE_NAME=bot
      - DATABASE_URL=postgresql+asyncpg://college_user:college_password@db:5432/college_flow
      - BOT_TOKEN=8398930262:AAFH4EcmJLCLoVW2d8-fRjGKBN7HQ28xwsg
      - API_URL=http://api:8000
    volumes:
      - ./logs:/app/logs
    command: python bot/main.py

  nginx:
    build: ./frontend
    container_name: college_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
volumes:
  postgres_data: