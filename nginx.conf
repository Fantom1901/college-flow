events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Общие заголовки CORS (вынес в переменную для удобства)
    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173" $http_origin;
        "http://localhost:5174" $http_origin;
        "https://dezhur-app.ru" $http_origin;
    }

    server {
        listen 80;
        server_name dezhur-app.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dezhur-app.ru;

        ssl_certificate /etc/letsencrypt/live/dezhur-app.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dezhur-app.ru/privkey.pem;

        # Обработка CORS (Preflight запросы)
        set $cors_headers "";
        if ($http_origin ~* (http://localhost:517[34]|https://dezhur-app.ru)) {
            set $cors_headers "1";
        }

        location ~* ^/api/v1/(auth|invite) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'X-TG-Data, Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            limit_req zone=strict_limit burst=3 nodelay;
            proxy_pass http://api:8000;
        }

        location /api/v1/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'X-TG-Data, Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            limit_req zone=global_limit burst=10 nodelay;
            proxy_pass http://api:8000;
        }

        location / {
            # Для корня тоже добавим, чтобы status работал
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            proxy_pass http://api:8000;
        }
    }
}