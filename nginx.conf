events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    underscores_in_headers on;

    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173" $http_origin;
        "http://localhost:5174" $http_origin;
        "https://dezhur-app.ru" $http_origin;
    }

    server {
        listen 80;
        server_name dezhur-app.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dezhur-app.ru;

        ssl_certificate /etc/letsencrypt/live/dezhur-app.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dezhur-app.ru/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location ~* ^/api/v1/(auth|invite) {
            # Прячем заголовок от бэка, чтобы не было дублей
            proxy_hide_header 'Access-Control-Allow-Origin';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'X-TG-Data, Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            limit_req zone=strict_limit burst=3 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header X-TG-Data $http_x_tg_data;
        }

        location /api/v1/ {
            # Прячем заголовок от бэка, чтобы не было дублей
            proxy_hide_header 'Access-Control-Allow-Origin';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'X-TG-Data, Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            limit_req zone=global_limit burst=10 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header X-TG-Data $http_x_tg_data;
        }

        location ~* ^/(docs|redoc|openapi.json) {
            proxy_hide_header 'Access-Control-Allow-Origin';

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'X-TG-Data, Content-Type, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            limit_req_status 429;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            # Здесь дублей быть не может, так как это статика
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}