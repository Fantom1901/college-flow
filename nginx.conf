events { worker_connections 1024; }

http {
    # Обычный лимит: 5 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=5r/s;

    # Строгий лимит: 1 запрос в секунду (для auth и invite)
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

    # Стандартные заголовки для прокси
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name dezhur-app.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dezhur-app.ru;

        ssl_certificate /etc/letsencrypt/live/dezhur-app.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dezhur-app.ru/privkey.pem;

        # 1. Защита эндпоинтов авторизации и инвайтов (Строгий КД)
        location ~* ^/api/v1/(auth|invite) {
            limit_req zone=strict_limit burst=3 nodelay;
            proxy_pass http://api:8000;
        }

        # 2. Общий КД на все остальные API запросы
        location /api/v1/ {
            limit_req zone=global_limit burst=10 nodelay;
            proxy_pass http://api:8000;
        }

        # 3. Все остальное (статус, докс и т.д.)
        location / {
            proxy_pass http://api:8000;
        }
    }
}