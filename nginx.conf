events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

    server {
        listen 80;
        server_name dezhur-app.ru;
        return 301 https://$host$request_uri;
    }

server {
        listen 443 ssl;
        server_name dezhur-app.ru;

        ssl_certificate /etc/letsencrypt/live/dezhur-app.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dezhur-app.ru/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location /api/v1/ {
            limit_req zone=global_limit burst=10 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-TG-Data $http_x_tg_data;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. ФРОНТЕНД - всё, что НЕ начинается с /api/
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Статика (важно, чтобы Nginx искал файлы именно в root)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}